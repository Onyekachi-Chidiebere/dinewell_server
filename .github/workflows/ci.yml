name: Server CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile
      - name: Check JavaScript syntax
        run: yarn run check
      - name: Run tests
        run: yarn test
      - name: Validate migrations statically
        run: yarn migration:check
      - name: Scan high-confidence secret patterns
        run: yarn secrets:scan
